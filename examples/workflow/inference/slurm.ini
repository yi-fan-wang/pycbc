; Add-on configuration to run the inference workflow examples on a SLURM
; cluster through Pegasus' glite/batch submission style. Append this file
; to the end of the --config-files list of pycbc_make_inference_workflow,
; e.g.
;
;   pycbc_make_inference_workflow \
;       --config-files workflow_config.ini events.ini slurm.ini ...
;
; Note that the condor|request_cpus and condor|request_memory profiles in
; workflow_config.ini are not translated into sbatch directives; the
; resources for the inference jobs are instead requested through the
; glite.arguments profile below.

[pegasus_profile]
pycbc|primary_site = slurm

[pegasus_profile-slurm]
; sbatch --partition for all jobs; delete to use the cluster default
pycbc|partition = compute
; sbatch --account; delete if your cluster does not use accounting
;pycbc|account = myproject
; scratch space on the shared filesystem
pycbc|site-scratch = ./
pycbc|unique-scratch =

[pegasus_profile-inference]
; request one node with as many cpus as pycbc_inference uses, and enough
; memory; adjust to match the nprocesses setting in the [inference] section
pegasus|glite.arguments = --nodes=1 --ntasks=1 --cpus-per-task=${inference|nprocesses} --mem=40G
