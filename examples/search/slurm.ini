; Additional configuration to run the example search workflow on a SLURM
; cluster through Pegasus' glite/batch submission style. Use together with
; the --config-overrides given in gen_slurm.sh, which move all jobs to the
; slurm site.

[pegasus_profile-slurm]
; sbatch --partition for all jobs; delete to use the cluster default
pycbc|partition = compute
; sbatch --account; delete if your cluster does not use accounting
;pycbc|account = myproject
; scratch space on the shared filesystem
pycbc|site-scratch = ./
pycbc|unique-scratch =
; extra sbatch directives applied to every job on this site
;pegasus|glite.arguments = --nodes=1

; The minifollowup executables generate sub-workflow dax files at runtime.
; Pegasus' deferred planning expects those dax files in the local site's
; scratch directory, but for a sharedfs site that stages to itself (like
; the slurm site) no transfer puts them there. Run the (lightweight)
; generator jobs on the local site instead, as also happens for the
; condorpool_symlink site used in production HTCondor runs.
[pegasus_profile-foreground_minifollowup]
pycbc|site = local

[pegasus_profile-singles_minifollowup]
pycbc|site = local

[pegasus_profile-injection_minifollowup]
pycbc|site = local
